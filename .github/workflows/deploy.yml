name: Deploy

# staging deploys automatically on every push to main (after tests pass).
# prod deploys only via a manually-triggered workflow_dispatch, so a
# human always has to explicitly ask for a prod rollout.
#
# Both jobs assume:
#   1. `cdk bootstrap` has already been run once against the target AWS
#      account/region (see README "Deploying to AWS").
#   2. An `AWS_ROLE_ARN` repository secret pointing at an IAM role this
#      repo can assume via GitHub's OIDC provider (no long-lived AWS
#      keys are stored in GitHub). The role needs permission to deploy
#      the CDK stack's resources and to push to the CDK bootstrap ECR
#      repo (`cdk deploy` builds/tags/pushes the Lambda container image
#      itself via asset publishing — there is no separate docker
#      build/push step here).
#
# Neither job can run in THIS environment (no AWS account/credentials
# configured) — the workflow is written and structurally complete, but
# unexercised until the user wires up the one-time OIDC/bootstrap setup
# described in the README.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production deploy'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CIStr0ngPass123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CIStr0ngPass123!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      DB_HOST: localhost
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: CIStr0ngPass123!
      DB_NAME: OrderManagementSystemTest
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ci-only-test-secret-do-not-use-in-production-32c
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_DAYS: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm run db:test:setup
      - run: npm run test:e2e

  test-frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  deploy-staging:
    if: github.event_name == 'push'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The CDK stack's BucketDeployment uploads whatever is already on
      # disk at frontend/dist — it doesn't build the SPA itself, so this
      # has to run before cdk deploy.
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm ci
      - run: npx cdk deploy -c env=staging --require-approval never

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm ci
      - run: npx cdk deploy -c env=prod --require-approval never
